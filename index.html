<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d0d0d0">
    <meta name="description" content="Ambient Mixer — layer rain, thunder, wind, forest, river, birds and frogs into your own soundscape.">
    <title>Ambient Mixer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Ambient Mixer</h1>
        <p>Layer rain, wind, water and wildlife into your own soundscape</p>
    </header>

    <main class="container">
        <section class="panel panel--presets" aria-label="Presets">
            <div class="panel-head">
                <span class="panel-icon" data-icon="save"></span>
                <h2>Presets</h2>
            </div>
            <div class="panel-body">
                <input type="text" id="preset-name" placeholder="Name this mix…"
                       class="preset-input" maxlength="40" aria-label="Preset name">
                <button id="save-preset" class="preset-button" type="button">Save</button>
                <select id="preset-select" class="preset-select" aria-label="Load a preset">
                    <option value="">Load a preset…</option>
                </select>
                <button id="delete-preset" class="preset-button delete" type="button">Delete</button>
            </div>
        </section>

        <section class="channels" aria-label="Sound channels">
            <div class="grid" id="sound-grid">
                <!-- Channel cards are generated from SOUND_CONFIG -->
            </div>
        </section>

        <section class="panel panel--master" aria-label="Master volume">
            <div class="master-group">
                <span class="panel-icon" data-icon="master"></span>
                <label for="master-volume">Master</label>
                <input type="range" id="master-volume" class="slider-horizontal master-volume"
                       min="0" max="100" value="70">
                <output class="master-value" for="master-volume">70%</output>
            </div>
        </section>

        <section class="panel panel--status" aria-label="Now playing" hidden id="status-panel">
            <div class="panel-head">
                <h2>Now playing</h2>
            </div>
            <div class="panel-body" id="status-body"></div>
        </section>
    </main>

    <footer>
        <p class="hint">
            Drag a dial <strong>vertically</strong> to set intensity ·
            <kbd>↑</kbd><kbd>↓</kbd> nudge · double-click centres · presets save in this browser
        </p>
        <p class="credit">Audio samples bundled with the project · runs entirely offline</p>
    </footer>

    <script src="audio-player.js"></script>
</body>
</html>
